              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/sims/{iccid}/replace:
    post:
      tags:
      - physical-sims
      summary: Swap a physical SIM to a replacement SIM
      operationId: replace_physical_sim_api_v1_sims__iccid__replace_post
      parameters:
      - name: iccid
        in: path
        required: true
        schema:
          type: string
          title: Iccid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SIMReplaceRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhysicalSIMResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
