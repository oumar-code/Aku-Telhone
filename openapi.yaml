  /api/v1/app/sessions:
    post:
      tags:
      - app
      summary: Create an Aku-Telhony app session
      operationId: create_app_session_api_v1_app_sessions_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppSessionRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppSessionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/app/customers/{customer_id}/dashboard:
    get:
      tags:
      - app
      summary: Get customer dashboard data for the Aku-Telhony app
      operationId: get_dashboard_api_v1_app_customers__customer_id__dashboard_get
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          type: string
          title: Customer Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LineStatusResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/app/subscriptions/{subscription_id}/activation:
    get:
      tags:
      - app
      summary: Poll activation progress and next steps for a line
      operationId: get_activation_status_api_v1_app_subscriptions__subscription_id__activation_get
      parameters:
      - name: subscription_id
        in: path
        required: true
        schema:
          type: string
          title: Subscription Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivationStatusResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/subscriptions/{subscription_id}:
    get:
      tags:
      - platform
      summary: Get a unified subscription record
      operationId: get_subscription_api_v1_subscriptions__subscription_id__get
      parameters:
      - name: subscription_id
        in: path
        required: true
        schema:
          type: string
          title: Subscription Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/platform/integration-contracts:
    get:
      tags:
      - platform
      summary: Describe Aku-Telhone service boundaries and integrations
      operationId: get_integration_contracts_api_v1_platform_integration_contracts_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformIntegrationResponse'
  /api/v1/platform/hub-policy-sync:
    post:
      tags:
      - platform
      summary: Sync hub policy and predictive cache hints from IG-Hub/Super Hub
      operationId: sync_hub_policy_api_v1_platform_hub_policy_sync_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HubPolicySyncRequest'
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HubPolicyResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/platform/hub-policy-sync/{edge_id}:
    get:
      tags:
      - platform
      summary: Get the latest synced policy for an Edge Hub
      operationId: get_hub_policy_api_v1_platform_hub_policy_sync__edge_id__get
      parameters:
      - name: edge_id
        in: path
        required: true
        schema:
          type: string
          title: Edge Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HubPolicyResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /readyz:
    get:
      tags:
      - platform
      summary: Readiness probe for orchestration
      operationId: readyz_readyz_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
  /api/v1/platform/metrics:
    get:
      tags:
      - platform
      summary: Structured platform metrics snapshot
      operationId: get_platform_metrics_api_v1_platform_metrics_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformMetricsResponse'
  /metrics:
    get:
      tags:
      - platform
      summary: Prometheus metrics
      operationId: metrics_metrics_get
      responses:
        '200':
          description: Successful Response
  /health:
    get:
      tags:
      - ops
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Health Health Get
components:
  schemas:
    ActivationStatusResponse:
      properties:
        subscription:
          $ref: '#/components/schemas/SubscriptionResponse'
        ready_for_use:
          type: boolean
          title: Ready For Use
        next_step:
          type: string
          title: Next Step
      type: object
      required:
      - subscription
      - ready_for_use
      - next_step
      title: ActivationStatusResponse
    AppSessionRequest:
      properties:
        customer_id:
          type: string
          title: Customer Id
        channel:
          type: string
          title: Channel
          description: 'Client channel: mobile | web'
          default: mobile
        device_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Device Id
      type: object
      required:
      - customer_id
      title: AppSessionRequest
    AppSessionResponse:
      properties:
        session_id:
          type: string
          title: Session Id
        customer_id:
          type: string
          title: Customer Id
        channel:
          type: string
          title: Channel
        issued_at:
          type: string
          format: date-time
          title: Issued At
        expires_at:
          type: string
          format: date-time
          title: Expires At
      type: object
      required:
      - session_id
      - customer_id
      - channel
      - expires_at
      title: AppSessionResponse
    BundleInfo:
      properties:
        bundle_id:
          type: string
          title: Bundle Id
        name:
          type: string
          title: Name
        category:
          type: string
          title: Category
          default: education
        active:
          type: boolean
          title: Active
          default: true
      type: object
      required:
      - bundle_id
      - name
      title: BundleInfo
    ComplianceStatus:
      type: string
      enum:
      - PENDING_REVIEW
      - APPROVED
      - RESTRICTED
      title: ComplianceStatus
    CustomerOnboardingRequest:
      properties:
        full_name:
          type: string
          minLength: 3
          title: Full Name
          description: Subscriber full legal name
        email:
          anyOf:
          - type: string
          - type: 'null'
          title: Email
          description: Primary email used by the Aku-Telhony app
        phone_number:
          anyOf:
          - type: string
          - type: 'null'
          title: Phone Number
          description: Primary reachable phone number
        nin_reference:
          anyOf:
          - type: string
          - type: 'null'
          title: Nin Reference
          description: Opaque NIN/KYC reference from the compliance provider; raw
            NIN is not stored
        role:
          $ref: '#/components/schemas/UserRole'
          description: Subscriber role for policy enforcement
          default: STUDENT
        allowed_bundles:
          items:
            type: string
          type: array
          title: Allowed Bundles
          description: Bundle identifiers the subscriber is eligible to activate
        metadata:
          additionalProperties: true
          type: object
          title: Metadata
          description: Free-form onboarding context such as state, school, or partner
            channel
      type: object
      required:
      - full_name
      title: CustomerOnboardingRequest
    CustomerProfileResponse:
      properties:
        customer_id:
          type: string
          title: Customer Id
        full_name:
          type: string
          title: Full Name
        email:
          anyOf:
          - type: string
          - type: 'null'
          title: Email
        phone_number:
          anyOf:
          - type: string
          - type: 'null'
          title: Phone Number
        role:
          $ref: '#/components/schemas/UserRole'
        kyc_status:
          $ref: '#/components/schemas/KYCStatus'
        compliance_status:
          $ref: '#/components/schemas/ComplianceStatus'
        nin_reference:
          anyOf:
          - type: string
          - type: 'null'
          title: Nin Reference
        allowed_bundles:
          items:
            type: string
          type: array
          title: Allowed Bundles
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - customer_id
      - full_name
      - role
      - kyc_status
      - compliance_status
      title: CustomerProfileResponse
    DeviceAttestRequest:
      properties:
        device_id:
          type: string
          title: Device Id
          description: Device identifier to attest
        attestation_token:
          type: string
          title: Attestation Token
          description: Platform attestation token (e.g. Android Key Attestation, Apple
            DeviceCheck)
        platform:
          type: string
          title: Platform
          description: 'Device platform: android | ios | embedded'
        firmware_hash:
          anyOf:
          - type: string
          - type: 'null'
          title: Firmware Hash
          description: Optional SHA-256 of the current firmware image for integrity
            verification
      type: object
      required:
      - device_id
      - attestation_token
      - platform
      title: DeviceAttestRequest
    DeviceAttestResponse:
      properties:
        device_id:
          type: string
          title: Device Id
        attested:
          type: boolean
          title: Attested
          description: True when Aku-IGHub confirmed the device attestation
        trust_level:
          anyOf:
          - type: string
          - type: 'null'
          title: Trust Level
          description: 'Trust tier returned by IGHub: FULL | LIMITED | UNTRUSTED'
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
          description: Human-readable explanation when attested=False
        attested_at:
          type: string
          format: date-time
          title: Attested At
        ighub_ref:
          anyOf:
          - type: string
          - type: 'null'
          title: Ighub Ref
          description: Reference ID assigned by Aku-IGHub for audit correlation
      type: object
      required:
      - device_id
      - attested
      title: DeviceAttestResponse
    ESIMDeactivateResponse:
      properties:
        iccid:
          type: string
          title: Iccid
        status:
          $ref: '#/components/schemas/ESIMStatus'
          default: DEACTIVATED
        deactivated_at:
          type: string
          format: date-time
          title: Deactivated At
        message:
          type: string
          title: Message
          default: eSIM profile deactivated successfully
      type: object
      required:
      - iccid
      title: ESIMDeactivateResponse
    ESIMProfileResponse:
      properties:
        iccid:
          type: string
          title: Iccid
        eid:
          type: string
          title: Eid
        device_id:
          type: string
          title: Device Id
        subscription_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Subscription Id
        status:
          $ref: '#/components/schemas/ESIMStatus'
        plan_id:
          type: string
          title: Plan Id
        preferred_network:
          $ref: '#/components/schemas/NetworkTechnology'
        provisioned_at:
          type: string
          format: date-time
          title: Provisioned At
        activated_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Activated At
        last_ota_push_at:
          anyOf:
