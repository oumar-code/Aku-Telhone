openapi: 3.1.0
info:
  title: Aku-Telhone
  description: Connectivity orchestration platform for the Aku ecosystem. Handles
    eSIM and physical SIM lifecycle management, customer onboarding, app-facing activation
    flows, hub policy integration, observability, and device attestation via Aku-IGHub.
  version: 0.1.0
paths:
  /api/v1/esim/provision:
    post:
      tags:
      - esim
      summary: Provision a new eSIM profile
      description: Allocates a new eSIM profile via the MVNO SM-DP+ platform. Returns
        the ICCID, LPA activation code, and QR code URL required by the device to
        download the profile. Profile status is initially PENDING until the device
        completes profile download and activates.
      operationId: provision_esim_api_v1_esim_provision_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ESIMProvisionRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ESIMProvisionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/esim/{iccid}:
    get:
      tags:
      - esim
      summary: Get eSIM profile status
      description: 'Returns the current state of an eSIM profile identified by its
        ICCID. Possible statuses: PENDING | ACTIVE | SWITCHING | DEACTIVATED.'
      operationId: get_esim_profile_api_v1_esim__iccid__get
      parameters:
      - name: iccid
        in: path
        required: true
        schema:
          type: string
          title: Iccid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ESIMProfileResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - esim
      summary: Deactivate an eSIM profile
      description: Permanently deactivates the eSIM profile and notifies the MVNO.
        A deactivated profile cannot be reactivated — provision a new profile if needed.
      operationId: deactivate_esim_api_v1_esim__iccid__delete
      parameters:
      - name: iccid
        in: path
        required: true
        schema:
          type: string
          title: Iccid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ESIMDeactivateResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/esim/{iccid}/switch-network:
    patch:
      tags:
      - esim
      summary: OTA network switch (MVNO)
      description: Initiates an over-the-air network switch for the eSIM profile.
        Sets profile status to SWITCHING and returns 202 Accepted immediately. The
        switch completes asynchronously; poll GET /{iccid} to confirm ACTIVE status.
      operationId: switch_network_api_v1_esim__iccid__switch_network_patch
      parameters:
      - name: iccid
        in: path
        required: true
        schema:
          type: string
          title: Iccid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NetworkSwitchRequest'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkSwitchAccepted'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/esim/{iccid}/ota-push:
    post:
      tags:
      - esim
      summary: Trigger a direct OTA push
      description: Enqueues an OTA payload delivery to the eSIM profile. Returns 202
        Accepted immediately; the push executes as a background task. Use the task_id
        to correlate logs or poll an internal status endpoint.
      operationId: trigger_ota_push_api_v1_esim__iccid__ota_push_post
      parameters:
      - name: iccid
        in: path
        required: true
        schema:
          type: string
          title: Iccid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OTAPushRequest'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OTAPushAccepted'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/devices/{device_id}/attest:
    post:
      tags:
      - devices
      summary: Attest a device via Aku-IGHub
      description: 'Forwards the device attestation token (Android Key Attestation,
        Apple DeviceCheck, or embedded platform token) to Aku-IGHub for cryptographic
        verification. Returns the trust level assigned by IGHub: FULL | LIMITED |
        UNTRUSTED. An attested device is a prerequisite for eSIM provisioning in production.'
      operationId: attest_device_api_v1_devices__device_id__attest_post
      parameters:
      - name: device_id
        in: path
        required: true
        schema:
          type: string
          title: Device Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceAttestRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceAttestResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/customers/onboard:
    post:
      tags:
      - customers
      summary: Onboard a Nigerian-market customer
      operationId: onboard_customer_api_v1_customers_onboard_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerOnboardingRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerProfileResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/customers/{customer_id}:
    get:
      tags:
      - customers
      summary: Get customer compliance and profile data
      operationId: get_customer_api_v1_customers__customer_id__get
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          type: string
          title: Customer Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerProfileResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/customers/{customer_id}/lines:
    get:
      tags:
      - customers
      summary: List all customer lines and bundles
      operationId: get_customer_lines_api_v1_customers__customer_id__lines_get
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          type: string
          title: Customer Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LineStatusResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/sims/inventory:
    post:
      tags:
      - physical-sims
      summary: Create a physical SIM inventory record
      operationId: create_inventory_record_api_v1_sims_inventory_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SIMInventoryRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhysicalSIMResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/sims/{iccid}:
    get:
      tags:
      - physical-sims
      summary: Get a physical SIM record
      operationId: get_physical_sim_api_v1_sims__iccid__get
      parameters:
      - name: iccid
        in: path
        required: true
        schema:
          type: string
          title: Iccid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhysicalSIMResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - physical-sims
      summary: Deactivate a physical SIM
      operationId: deactivate_physical_sim_api_v1_sims__iccid__delete
      parameters:
      - name: iccid
        in: path
        required: true
        schema:
          type: string
          title: Iccid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhysicalSIMResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/sims/{iccid}/assign:
    post:
      tags:
      - physical-sims
      summary: Assign a physical SIM to a customer/device
      operationId: assign_physical_sim_api_v1_sims__iccid__assign_post
      parameters:
      - name: iccid
        in: path
        required: true
        schema:
          type: string
          title: Iccid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SIMAssignRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhysicalSIMResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/sims/{iccid}/activate:
    post:
      tags:
      - physical-sims
      summary: Activate an assigned physical SIM
      operationId: activate_physical_sim_api_v1_sims__iccid__activate_post
      parameters:
      - name: iccid
        in: path
        required: true
